name: Tests

on: [push]

jobs:
  build:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift: ["6.2", "6.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: ${{ matrix.swift }}
      - uses: actions/checkout@v5
      #- name: Build
      #  run: swift build
      - name: Run tests
        run: swift test
